  <line x1="626" y1="132" x2="626" y2="200" stroke="#2e7d32" stroke-width="2" marker-end="url(#head1)"/>
  <text x="614" y="166" fill="#2e7d32" text-anchor="middle" transform="rotate(-90 614 166)">axis 1</text>
  <line x1="642" y1="216" x2="734" y2="216" stroke="#7b3fa0" stroke-width="2" marker-end="url(#head2)"/>
  <text x="688" y="232" fill="#7b3fa0" text-anchor="middle">axis 2</text>
  <text x="615" y="254" font-family="Consolas, monospace" fill="#222">shape (3, 3, 4)   ndim 3</text>
  <text x="615" y="276" fill="#555">3 grayscale images, 3 × 4 pixels</text>
