  <text x="270" y="240" font-family="Consolas, monospace" fill="#222">shape (4, 3)   ndim 2</text>
  <text x="270" y="262" fill="#555">3 features of 4 parts</text>

  <!-- 3D array -->
  <text x="615" y="28" font-size="15" font-weight="bold" fill="#222">3D array</text>
  <g stroke="#4a6fa5" stroke-width="1.2">
    <g fill="#c9dcf2" transform="translate(32,-32)">
      <rect x="640" y="130" width="96" height="72"/>
      <path d="M664,130 V202 M688,130 V202 M712,130 V202 M640,154 H736 M640,178 H736" fill="none"/>
    </g>
    <g fill="#d8e6f6" transform="translate(16,-16)">
