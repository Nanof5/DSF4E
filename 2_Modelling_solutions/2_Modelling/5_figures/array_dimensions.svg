<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 290" width="850" height="290" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="head0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d35400"/>
    </marker>
    <marker id="head1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
    <marker id="head2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7b3fa0"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="850" height="290" rx="8" fill="#ffffff"/>

  <!-- 1D array -->
  <text x="30" y="28" font-size="15" font-weight="bold" fill="#222">1D array: vector</text>
  <text x="110" y="64" text-anchor="middle" fill="#444">Speed</text>
  <g fill="#e8f1fb" stroke="#4a6fa5" stroke-width="1.2">
    <rect x="70" y="72" width="80" height="34"/>
    <rect x="70" y="106" width="80" height="34"/>
    <rect x="70" y="140" width="80" height="34"/>
    <rect x="70" y="174" width="80" height="34"/>
  </g>
  <g text-anchor="middle" fill="#222">
    <text x="110" y="94">18.4</text>
    <text x="110" y="128">25.1</text>
    <text x="110" y="162">9.7</text>
    <text x="110" y="196">21.3</text>
  </g>
  <line x1="52" y1="74" x2="52" y2="206" stroke="#d35400" stroke-width="2" marker-end="url(#head0)"/>
