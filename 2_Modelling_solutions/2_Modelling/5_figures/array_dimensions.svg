    <text x="440" y="64">Speed</text>
    <text x="520" y="64">Power</text>
  </g>
  <g fill="#e8f1fb" stroke="#4a6fa5" stroke-width="1.2">
    <rect x="320" y="72" width="80" height="34"/><rect x="400" y="72" width="80" height="34"/><rect x="480" y="72" width="80" height="34"/>
    <rect x="320" y="106" width="80" height="34"/><rect x="400" y="106" width="80" height="34"/><rect x="480" y="106" width="80" height="34"/>
    <rect x="320" y="140" width="80" height="34"/><rect x="400" y="140" width="80" height="34"/><rect x="480" y="140" width="80" height="34"/>
    <rect x="320" y="174" width="80" height="34"/><rect x="400" y="174" width="80" height="34"/><rect x="480" y="174" width="80" height="34"/>
  </g>
  <g text-anchor="middle" fill="#222">
    <text x="360" y="94">1.02</text><text x="440" y="94">18.4</text><text x="520" y="94">1310</text>
